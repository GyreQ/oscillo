<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oscillo</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<script src="theme.js"></script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<!-- 顶栏：品牌 · 居中分段导航 · 动作区。桌面客户端整条可拖拽（红绿灯在其左） -->
<header class="top" style="--wails-draggable:drag">
  <div class="brand">
    <span class="logo" aria-hidden="true"><svg viewBox="0 0 46 44" width="18" height="17"><path d="M3 22h9l4-11 7 22 5-11h11" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="41.5" cy="22" r="3" fill="var(--live, #3fdc9b)"/></svg></span>
    <span>Oscillo</span>
  </div>
  <nav class="seg" id="nav" aria-label="主导航" style="--wails-draggable:no-drag"></nav>
  <div class="actions" style="--wails-draggable:no-drag">
    <span class="rec" id="recState" title="网关连接状态"><i></i><span id="recText">连接中</span></span>
    <button type="button" class="cap-btn" id="capBtn" hidden>Capture</button>
    <button type="button" class="icon" id="themeBtn" title="切换深浅主题">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M8 3v2M8 11v2M3 8h2M11 8h2M4.7 4.7l1.4 1.4M9.9 9.9l1.4 1.4M11.3 4.7 9.9 6.1M6.1 9.9 4.7 11.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/><circle cx="8" cy="8" r="2.6" fill="none" stroke="currentColor" stroke-width="1.4"/></svg>
    </button>
    <button type="button" class="icon web-only" id="openBtn" title="在浏览器中打开">
      <svg viewBox="0 0 16 16" width="14" height="14"><path d="M6 3H3.5A1.5 1.5 0 0 0 2 4.5v8A1.5 1.5 0 0 0 3.5 14h8a1.5 1.5 0 0 0 1.5-1.5V10M9 2h5v5M14 2 8 8" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>
</header>

<!-- 视图容器：hash 路由渲染到这里 -->
<main class="view" id="view"></main>

<!-- 底部状态栏 -->
<footer class="foot">
  <span class="status" id="footStatus">—</span>
  <span class="grow"></span>
  <span class="foot-dim" id="footHint">~/.ai-trace</span>
</footer>

<script src="fmt.js"></script>
<script src="api.js"></script>
<script src="ui.js"></script>
<script src="live.js"></script>
<script src="view-replay.js"></script>
<script src="view-overview.js"></script>
<script src="view-requests.js"></script>
<script src="view-turn.js"></script>
<script src="view-sessions.js"></script>
<script src="view-skills.js"></script>
<script src="view-stats.js"></script>
<script src="view-diff.js"></script>
<script src="app.js"></script>
</body>
</html>
